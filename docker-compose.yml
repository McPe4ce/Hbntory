services:
  backoffice:
    build: ./backoffice
    ports:
      - "5000:5000"
    volumes:
      # Persist the SQLite DB across rebuilds (Flask instance folder)
      - backoffice_db:/app/instance
    environment:
      - FLASK_ENV=development

  # --- Uncomment when product_mcp_server/ exists ---
  # product_mcp_server:
  #   build: ./product_mcp_server
  #   ports:
  #     - "8001:8001"
  #   depends_on:
  #     - product-api

  # --- Provided external Product API container ---
  # Replace `image:` with the actual image name given by the professor
  # product-api:
  #   image: <provided-product-api-image>
  #   ports:
  #     - "8000:8000"

volumes:
  backoffice_db:
